query GetYieldDtf($id: ID!) {
  rtoken(id: $id) {
    id
    createdTimestamp
    owners
    pausers
    freezers
    longFreezers
    rewardTokenSupply
    rsrExchangeRate
    rsrStaked
    rsrStakedUSD
    basketsNeeded
    targetUnits
    token {
      id
      name
      symbol
      decimals
      totalSupply
      holderCount
      transferCount
      mintCount
      burnCount
    }
    rewardToken {
      token {
        id
        name
        symbol
        decimals
        totalSupply
      }
    }
    revenueDistribution {
      id
      destination
      rTokenDist
      rsrDist
    }
  }
}

query ListYieldDtfs($limit: Int!, $offset: Int!) {
  rtokens(first: $limit, skip: $offset, orderBy: cumulativeUniqueUsers, orderDirection: desc) {
    id
    targetUnits
    rsrStaked
    basketsNeeded
    token {
      id
      name
      symbol
      decimals
      totalSupply
      holderCount
      lastPriceUSD
    }
  }
}

query GetYieldDtfHolders($id: ID!, $limit: Int!, $offset: Int!) {
  token(id: $id) {
    holderCount
    holdersBalance(first: $limit, skip: $offset, orderBy: amount, orderDirection: desc) {
      account {
        id
      }
      amount
      transferCount
      timestamp
    }
  }
}

query GetYieldDtfTransactions($rTokenId: String!, $limit: Int!, $offset: Int!) {
  entries(where: { rToken: $rTokenId }, orderBy: timestamp, orderDirection: desc, first: $limit, skip: $offset) {
    id
    hash
    type
    amount
    amountUSD
    timestamp
    from {
      id
    }
    to {
      id
    }
  }
}

query GetAccountStakeRecords($accountRTokenId: String!, $limit: Int!, $offset: Int!) {
  accountStakeRecords(
    where: { account: $accountRTokenId }
    orderBy: blockNumber
    orderDirection: asc
    first: $limit
    skip: $offset
  ) {
    id
    hash
    isStake
    amount
    amountRaw
    rsrAmount
    rsrAmountRaw
    exchangeRate
    rsrPriceUSD
    timestamp
    blockNumber
  }
}

query GetYieldDtfGovernance($id: ID!) {
  rtoken(id: $id) {
    owners
  }
  governance(id: $id) {
    proposals
    proposalsQueued
    proposalsExecuted
    proposalsCanceled
    currentDelegates
    delegatedVotes
    totalTokenSupply
    guardians
    governanceFrameworks(orderBy: name, orderDirection: desc) {
      id
      name
      contractAddress
      timelockAddress
      executionDelay
      votingDelay
      votingPeriod
      proposalThreshold
      quorumVotes
      quorumNumerator
      quorumDenominator
    }
  }
}

query GetYieldDtfProposals($governanceId: String!, $limit: Int!, $offset: Int!) {
  proposals(
    where: { governance: $governanceId }
    orderBy: creationTime
    orderDirection: desc
    first: $limit
    skip: $offset
  ) {
    id
    description
    creationTime
    state
    forWeightedVotes
    againstWeightedVotes
    abstainWeightedVotes
    quorumVotes
    startBlock
    endBlock
    executionETA
    proposer {
      address
    }
    governanceFramework {
      name
      contractAddress
    }
  }
}

query GetYieldDtfProposal($id: ID!) {
  proposal(id: $id) {
    id
    txnHash
    description
    creationTime
    creationBlock
    state
    forWeightedVotes
    againstWeightedVotes
    abstainWeightedVotes
    quorumVotes
    forDelegateVotes
    againstDelegateVotes
    abstainDelegateVotes
    startBlock
    endBlock
    queueTime
    queueTxnHash
    executionETA
    executionTime
    executionTxnHash
    cancellationTime
    targets
    calldatas
    proposer {
      address
    }
    votes(orderBy: weight, orderDirection: desc, first: 500) {
      choice
      weight
      voter {
        address
      }
    }
    governanceFramework {
      name
      contractAddress
      timelockAddress
    }
  }
}

query GetYieldDtfTrades($rTokenId: String!, $limit: Int!, $offset: Int!) {
  trades(where: { rToken: $rTokenId }, orderBy: startedAt, orderDirection: desc, first: $limit, skip: $offset) {
    id
    kind
    auctionId
    selling
    sellingTokenSymbol
    sellingTokenDecimals
    buying
    buyingTokenSymbol
    buyingTokenDecimals
    amount
    minBuyAmount
    boughtAmount
    worstCasePrice
    startedAt
    endAt
    isSettled
    settleTxHash
  }
}

query GetYieldDtfDailySnapshots($rTokenId: String!, $limit: Int!) {
  rtokenDailySnapshots(where: { rToken: $rTokenId }, orderBy: timestamp, orderDirection: desc, first: $limit) {
    timestamp
    rsrExchangeRate
    rsrStaked
    rewardTokenSupply
    rsrPrice
  }
}

query GetYieldDtfProposalFeed($limit: Int = 1000, $offset: Int = 0) {
  proposals(first: $limit, skip: $offset, orderBy: creationTime, orderDirection: desc) {
    id
    description
    creationTime
    state
    forWeightedVotes
    againstWeightedVotes
    abstainWeightedVotes
    quorumVotes
    forDelegateVotes
    againstDelegateVotes
    abstainDelegateVotes
    startBlock
    endBlock
    executionETA
    proposer {
      address
    }
    governanceFramework {
      name
      contractAddress
    }
    governance {
      rToken {
        id
        token {
          symbol
          name
        }
      }
    }
  }
}

query GetYieldDtfTopVoters($limit: Int = 20) {
  delegates(first: $limit, orderBy: numberVotes, orderDirection: desc, where: { numberVotes_gt: 0 }) {
    address
    numberVotes
    delegatedVotesRaw
    tokenHoldersRepresentedAmount
    governance {
      rToken {
        id
        token {
          symbol
          name
        }
      }
    }
  }
}

query GetYieldDtfProtocolStakingTotals {
  protocols(first: 1) {
    rsrStaked
    rsrStakedUSD
    totalRsrStaked
    totalRsrUnstaked
    rTokenCount
  }
}

query GetYieldDtfGovernanceActivity($limit: Int = 50) {
  votes(first: $limit, orderBy: blockTime, orderDirection: desc) {
    choice
    weight
    blockTime
    txnHash
    voter {
      address
    }
    proposal {
      id
      governance {
        ...YieldActivityGovernance
      }
    }
  }
  proposals(first: $limit, orderBy: creationTime, orderDirection: desc) {
    id
    txnHash
    creationTime
    proposer {
      address
    }
    governance {
      ...YieldActivityGovernance
    }
  }
  queued: proposals(first: $limit, orderBy: queueTime, orderDirection: desc, where: { queueTime_not: null }) {
    id
    queueTime
    queueTxnHash
    proposer {
      address
    }
    governance {
      ...YieldActivityGovernance
    }
  }
  executed: proposals(first: $limit, orderBy: executionTime, orderDirection: desc, where: { executionTime_not: null }) {
    id
    executionTime
    executionTxnHash
    proposer {
      address
    }
    governance {
      ...YieldActivityGovernance
    }
  }
  canceled: proposals(
    first: $limit
    orderBy: cancellationTime
    orderDirection: desc
    where: { cancellationTime_not: null }
  ) {
    id
    cancellationTime
    cancellationTxnHash
    proposer {
      address
    }
    governance {
      ...YieldActivityGovernance
    }
  }
  entries(
    first: $limit
    orderBy: timestamp
    orderDirection: desc
    where: { type_in: ["STAKE", "UNSTAKE"], rToken_not: null }
  ) {
    type
    hash
    timestamp
    amount
    stAmount
    from {
      id
    }
    rToken {
      id
      token {
        symbol
        name
      }
    }
  }
}

fragment YieldActivityGovernance on Governance {
  rToken {
    id
    token {
      symbol
      name
    }
  }
}
